<!DOCTYPE html>
<html lang="ta">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>சொற்களம் • Sorkalam</title>
  <link rel="stylesheet" href="css/popup.css">
</head>
<body class="app">
  <div class="app-shell">
    <div class="lookup-strip">
      <form class="lookup-form" role="search">
        <label class="search-field" for="word">
          <span class="sr-only">Search word</span>
          <input
            type="search"
            id="word"
            name="word"
            placeholder="தமிழ் or English…"
            autocomplete="off"
            spellcheck="false"
          >
        </label>

        <div class="provider-row" role="group" aria-label="Lookup sources">
          <button
            type="button"
            id="wiki-btn"
            class="provider-btn provider-btn--wiki"
            title="Wiktionary — lookup in popup"
            aria-label="Wiktionary — lookup in popup"
          >W</button>
          <button
            type="button"
            id="tvu-btn"
            class="provider-btn provider-btn--tvu"
            title="Tamil VU Glossary — lookup in popup"
            aria-label="Tamil VU Glossary — lookup in popup"
          >TVU</button>
          <a
            id="grok-btn"
            class="provider-btn provider-btn--grok provider-btn--external"
            href="https://grok.com/"
            title="Grok — https://grok.com/"
            aria-label="Grok — opens in new tab"
            target="_blank"
            rel="noopener noreferrer"
          >
            <span class="provider-label">G</span>
            <span class="provider-external-badge" aria-hidden="true">
              <svg viewBox="0 0 12 12" focusable="false">
                <path
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.35"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M7.25 1.75H10v2.75M10 1.75 5.5 6.25M4.25 4.25H2v6.25h6.25V8.25"
                />
              </svg>
            </span>
          </a>
          <a
            id="gp-btn"
            class="provider-btn provider-btn--gp provider-btn--external"
            href="https://grokipedia.com/search"
            title="Grokipedia — https://grokipedia.com/search"
            aria-label="Grokipedia — opens in new tab"
            target="_blank"
            rel="noopener noreferrer"
          >
            <span class="provider-label">GP</span>
            <span class="provider-external-badge" aria-hidden="true">
              <svg viewBox="0 0 12 12" focusable="false">
                <path
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.35"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M7.25 1.75H10v2.75M10 1.75 5.5 6.25M4.25 4.25H2v6.25h6.25V8.25"
                />
              </svg>
            </span>
          </a>
        </div>
      </form>

      <p id="status" class="status-line" role="status" aria-live="polite"></p>
    </div>

    <section id="results" class="results-panel" aria-live="polite"></section>
    <div id="results-meta" class="results-meta" aria-live="polite"></div>

    <footer class="app-footer" aria-label="சொற்களம்">
      <img
        src="images/sorkalam-logo-retro.png"
        alt="சொற்களம்"
        class="app-logo"
        width="40"
        height="40"
      >
    </footer>
  </div>

  <script src="glossary-cache.js"></script>
  <script src="tamilvu-glossary-parse.js"></script>
  <script src="popup.js"></script>
</body>
</html>
