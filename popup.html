<!DOCTYPE html>
<html lang="ta">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>சொற்களம் • Sorkalam</title>
  <link rel="stylesheet" href="css/popup.css">
  <style>
    /* Modern additions following modern-web-guidance */
    :root {
      --primary: #0a66c2;
    }
    
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 12px;
      width: 380px;
      background: #f8f9fa;
    }
    
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }
    
    .logo {
      height: 32px;
    }
    
    .input-group {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }
    
    #word {
      flex: 1;
      padding: 10px 14px;
      border: 2px solid #ddd;
      border-radius: 8px;
      font-size: 15px;
      outline: none;
    }
    
    #word:focus {
      border-color: var(--primary);
    }
    
    .btn-group {
      display: flex;
      gap: 8px;
    }
    
    button {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    
    #wiki-btn {
      background: #0a66c2;
      color: white;
    }
    
    #tvu-btn {
      background: #e30613;
      color: white;
    }
    
    button:hover {
      filter: brightness(1.1);
      transform: translateY(-1px);
    }
    
    #results {
      margin-top: 16px;
      padding: 12px;
      background: white;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      max-height: 320px;
      overflow-y: auto;
    }
    
    .result-item {
      padding: 8px 0;
      border-bottom: 1px solid #eee;
    }
    
    .result-item:last-child {
      border-bottom: none;
    }
    
    .language-badge {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 9999px;
      background: #e0f0ff;
      color: #0a66c2;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="header">
    <img src="logo-150-50.png" alt="சொற்களம்" class="logo">
    <div>
      <h1 style="margin:0; font-size:18px;">சொற்களம்</h1>
      <p style="margin:0; font-size:11px; color:#666;">Tamil ↔ English Dictionary</p>
    </div>
  </div>

  <div class="input-group">
    <input type="text" id="word" placeholder="தமிழ் / English word..." autocomplete="off">
  </div>

  <div class="btn-group">
    <button id="wiki-btn">Wiktionary</button>
    <button id="tvu-btn">Tamil VU Glossary</button>
  </div>

  <div id="results" style="display:none;"></div>
  
  <div id="status" style="margin-top:8px; font-size:12px; color:#666; text-align:center;"></div>

  <script src="glossary-cache.js"></script>
  <script src="tamilvu-glossary-parse.js"></script>
  <script src="popup.js"></script>
</body>
</html>
