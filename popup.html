<!DOCTYPE html>
<html lang="ta">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>சொற்களம் • Sorkalam</title>
  <link rel="stylesheet" href="css/popup.css">
</head>
<body class="app">
  <div class="app-shell">
    <div class="lookup-strip">
      <form class="lookup-form" role="search">
        <label class="search-field" for="word">
          <span class="sr-only">Search word</span>
          <input
            type="search"
            id="word"
            name="word"
            placeholder="தமிழ் or English…"
            autocomplete="off"
            spellcheck="false"
          >
        </label>

        <div class="action-row">
          <button
            type="button"
            id="wiki-btn"
            class="btn btn-wiki"
            aria-label="Look up on Wiktionary"
          >Wiktionary</button>
          <button
            type="button"
            id="tvu-btn"
            class="btn btn-tvu"
            aria-label="Look up on Tamil VU glossary"
          >Tamil VU</button>
        </div>
      </form>

      <p id="status" class="status-line" role="status" aria-live="polite"></p>
    </div>

    <section id="results" class="results-panel" aria-live="polite"></section>
    <div id="results-meta" class="results-meta" aria-live="polite"></div>

    <footer class="app-footer" aria-label="சொற்களம்">
      <img
        src="logo.svg"
        alt=""
        class="app-mark"
        width="28"
        height="32"
        aria-hidden="true"
      >
      <span class="app-wordmark" lang="ta">சொற்களம்</span>
    </footer>
  </div>

  <script src="glossary-cache.js"></script>
  <script src="tamilvu-glossary-parse.js"></script>
  <script src="popup.js"></script>
</body>
</html>
