<!DOCTYPE html>
<html lang="ta">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>சொற்களம் • Sorkalam</title>
  <link rel="stylesheet" href="css/popup.css">
</head>
<body class="app">
  <div class="app-shell">
  <div class="lookup-strip">
    <header class="app-header">
      <img
        src="logo-150-50.png"
        alt="சொற்களம்"
        class="app-logo"
        width="120"
        height="40"
      >
    </header>

    <label class="search-field" for="word">
      <input
        type="text"
        id="word"
        placeholder="தமிழ் or English…"
        autocomplete="off"
        spellcheck="false"
      >
    </label>

    <div class="action-row">
      <button type="button" id="wiki-btn" class="btn btn-wiki">Wiktionary</button>
      <button type="button" id="tvu-btn" class="btn btn-tvu">Tamil VU</button>
    </div>

    <p id="status" class="status-line" role="status" aria-live="polite"></p>
  </div>

  <section id="results" class="results-panel" aria-live="polite"></section>
  </div>

  <script src="glossary-cache.js"></script>
  <script src="tamilvu-glossary-parse.js"></script>
  <script src="popup.js"></script>
</body>
</html>
