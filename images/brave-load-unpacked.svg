<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400" role="img" aria-label="Selecting the Sorkalam folder in Load unpacked dialog">
  <rect width="720" height="400" fill="#f0f2f5" rx="8"/>
  <rect x="120" y="40" width="480" height="320" rx="10" fill="#fff" stroke="#c4c7cc" stroke-width="2"/>
  <text x="144" y="72" font-family="system-ui,sans-serif" font-size="14" font-weight="bold" fill="#1a1a1a">Select the extension directory</text>
  <rect x="144" y="88" width="432" height="28" rx="4" fill="#f8f9fa" stroke="#dadce0"/>
  <text x="156" y="107" font-family="ui-monospace,monospace" font-size="11" fill="#444">/path/to/Sorkalam</text>
  <rect x="144" y="128" width="432" height="180" fill="#fafafa" stroke="#e8eaed"/>
  <text x="160" y="156" font-family="ui-monospace,monospace" font-size="12" fill="#666">css/</text>
  <text x="160" y="180" font-family="ui-monospace,monospace" font-size="12" fill="#666">docs/</text>
  <text x="160" y="204" font-family="ui-monospace,monospace" font-size="12" fill="#1a1a1a" font-weight="bold">manifest.json</text>
  <text x="160" y="228" font-family="ui-monospace,monospace" font-size="12" fill="#666">popup.html</text>
  <text x="160" y="252" font-family="ui-monospace,monospace" font-size="12" fill="#666">popup.js</text>
  <text x="160" y="276" font-family="ui-monospace,monospace" font-size="12" fill="#666">event.js</text>
  <rect x="144" y="196" width="432" height="24" fill="#e3f2fd" opacity="0.6"/>
  <rect x="360" y="324" width="100" height="28" rx="6" fill="#e8eaed" stroke="#dadce0"/>
  <text x="388" y="343" font-family="system-ui,sans-serif" font-size="12" fill="#444">Cancel</text>
  <rect x="472" y="324" width="104" height="28" rx="6" fill="#fb542b"/>
  <text x="492" y="343" font-family="system-ui,sans-serif" font-size="12" font-weight="bold" fill="#fff">Select</text>
  <rect x="24" y="340" width="672" height="48" rx="6" fill="#e8f5e9" stroke="#81c784"/>
  <text x="40" y="368" font-family="system-ui,sans-serif" font-size="12" fill="#2e7d32">2. Load unpacked - pick the folder that contains manifest.json</text>
